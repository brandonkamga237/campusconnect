services:
  config-server:
    build: ./config-server
    ports: ["8888:8888"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8888/actuator/health"]
      interval: 10s
      retries: 12

  discovery-server:
    build: ./discovery-server
    ports: ["8761:8761"]
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8761/actuator/health"]
      interval: 10s
      retries: 12

  api-gateway:
    build: ./api-gateway
    ports: ["8080:8080"]
    environment: &common-env
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-at-least-32-bytes!!}
    depends_on: &depends-base
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  # Une base par service : l'image crée la base et l'utilisateur à partir des variables.
  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth}
    volumes: ["auth-db-data:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      retries: 12

  student-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: student_db
      POSTGRES_USER: student_user
      POSTGRES_PASSWORD: ${STUDENT_DB_PASSWORD:-student}
    volumes: ["student-db-data:/var/lib/postgresql/data"]
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student_user -d student_db"]
      interval: 5s
      retries: 12

  # SMTP de dev : capture tous les emails (vérification, mot de passe oublié).
  # Interface web : http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "8025:8025"   # interface web
      - "1026:1025"   # SMTP, pour un service lancé hors Docker (1025 souvent déjà pris)

  auth-service:
    build: ./authservice
    ports: ["8081:8081"]
    environment:
      <<: *common-env
      AUTH_DB_URL: postgresql+psycopg://auth_user:${AUTH_DB_PASSWORD:-auth}@auth-db:5432/auth_db
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      FACE_ENCRYPTION_KEY: ${FACE_ENCRYPTION_KEY:-dev-face-key-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@campusconnect.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
    depends_on:
      <<: *depends-base
      auth-db: { condition: service_healthy }
      mailpit: { condition: service_started }

  student-service:
    build: ./student-service
    ports: ["8083:8083"]
    environment:
      <<: *common-env
      STUDENT_DB_URL: jdbc:postgresql://student-db:5432/student_db
      STUDENT_DB_PASSWORD: ${STUDENT_DB_PASSWORD:-student}
    depends_on:
      <<: *depends-base
      student-db: { condition: service_healthy }

volumes:
  auth-db-data:
  student-db-data:

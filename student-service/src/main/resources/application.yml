spring:
  application:
    name: student-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  # Valeurs de secours si le config-server est absent (configurations/student-service.yml est prioritaire)
  datasource:
    url: ${STUDENT_DB_URL:jdbc:postgresql://localhost:5433/student_db}
    username: ${STUDENT_DB_USER:student_user}
    password: ${STUDENT_DB_PASSWORD:student}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # le schéma est géré par Flyway (src/main/resources/db/migration)
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: 8083

jwt:
  secret: ${JWT_SECRET:dev-secret-change-me-at-least-32-bytes!!}
  issuer: campusconnect-auth

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
